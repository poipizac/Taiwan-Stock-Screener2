name: Daily Stock Update

# 設定觸發條件
on:
  schedule:
    # 對應台灣時間 19:43 執行
    - cron: '43 11 * * *'
  
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 10x Stock Scraper
        run: python update_data.py

      - name: Run Disposition Scraper
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fetch_disposition.py  

      - name: Run Momentum Screener
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python momentum_screener_final.py

      - name: Run Weekly KD & Daily RSI Screener
        run: python fetch_kd_rsi.py

      - name: Commit and Push changes
        run: |
          git add *.json
